<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Project Details | Sabuz Rana</title>

    <meta
        name="description"
        content="Project details and screenshots by Sabuz Rana."
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

</head>


<body>


<!-- ==========================
     Navigation
========================== -->

<header>

    <nav class="navbar">

        <ul class="nav-links">

            <li>
                <a href="index.html#home">
                    Home
                </a>
            </li>

            <li>
                <a href="index.html#about">
                    About
                </a>
            </li>

            <li>
                <a href="index.html#skills">
                    Skills
                </a>
            </li>

            <li>
                <a href="index.html#projects">
                    Projects
                </a>
            </li>

            <li>
                <a href="index.html#contact">
                    Contact
                </a>
            </li>

        </ul>

    </nav>

</header>


<!-- ==========================
     Project Details
========================== -->

<main>

    <section class="project-details-page">


        <!-- Back Button -->

        <div class="project-back">

            <a href="index.html#projects">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Projects

            </a>

        </div>


        <!-- Project Header -->

        <div
            class="project-details-header"
            id="project-details-header"
        >

            <h1 id="project-title">
                Loading Project...
            </h1>

            <p id="project-description">
                Loading project details...
            </p>

        </div>


        <!-- Project Technologies -->

        <div
            class="project-technologies"
            id="project-technologies"
        >
        </div>


        <!-- Project Images -->

        <div
            class="project-gallery"
            id="project-gallery"
        >
        </div>


        <!-- GitHub -->

        <div
            class="project-github"
            id="project-github"
        >
        </div>


    </section>

</main>



<!-- ==========================
     Image Lightbox
========================== -->

<div
    class="image-lightbox"
    id="image-lightbox"
    aria-hidden="true"
>


    <!-- Close -->

    <button
        class="lightbox-close"
        id="lightbox-close"
        aria-label="Close image preview"
    >

        <i class="fa-solid fa-xmark"></i>

    </button>


    <!-- Previous -->

    <button
        class="lightbox-prev"
        id="lightbox-prev"
        aria-label="Previous image"
    >

        <i class="fa-solid fa-chevron-left"></i>

    </button>


    <!-- Image Area -->

    <div class="lightbox-content">


        <img
            id="lightbox-image"
            src=""
            alt="Project preview"
        >


        <div class="lightbox-counter">

            <span id="lightbox-current">
                1
            </span>

            /

            <span id="lightbox-total">
                1
            </span>

        </div>


    </div>


    <!-- Next -->

    <button
        class="lightbox-next"
        id="lightbox-next"
        aria-label="Next image"
    >

        <i class="fa-solid fa-chevron-right"></i>

    </button>


    <!-- Zoom Controls -->

    <div class="lightbox-controls">


        <button
            id="zoom-out"
            aria-label="Zoom out"
        >

            <i class="fa-solid fa-minus"></i>

        </button>


        <button
            id="zoom-reset"
            aria-label="Reset zoom"
        >

            <i class="fa-solid fa-expand"></i>

        </button>


        <button
            id="zoom-in"
            aria-label="Zoom in"
        >

            <i class="fa-solid fa-plus"></i>

        </button>


    </div>


</div>



<!-- ==========================
     JavaScript
========================== -->

<script src="js/projects.js"></script>

<script src="js/project-details.js"></script>


</body>

</html>
